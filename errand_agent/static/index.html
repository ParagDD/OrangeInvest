.k-user_msg{color:#6cc7f5}.k-agent_msg{color:#6fe39a}.k-state{color:#f5d04a}.k-tool_call,.k-tool_result{color:#c4a9ee}.k-approval_granted,.k-approval_consumed{color:#6fe39a}

.cat-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

.cat-card:hover{border-color:#555}

</style></head><body>
<header><div class="logo" aria-hidden="true">O</div><b>Orange Invest</b><span class="sub">Errands</span>
<span id="model-tag" style="background:#222;color:#ff7900;border:1px solid #444;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;margin-left:6px">AI: loading...</span>
<button id="btn-cat" title="Explore local provider catalog"><span style="color:var(--brand)">📋</span><span>Catalog (10)</span></button>
<button id="pill" aria-expanded="false" title="Show what the agent is doing"><i></i><span id="pt">Under the hood</span></button></header>
<div id="app">
<div class="stage"><div id="feed"><div class="col" id="col"></div></div>
 <div class="dock"><div class="col"><div class="chips" id="chips"></div>
 <form id="f"><input id="in" autocomplete="off" placeholder="Describe what needs doing, in your own words" aria-label="Message"><button>Send</button></form></div></div></div>
<aside id="hood" aria-label="Under the hood">
 <h2>Under the hood <small>what the agent is really doing</small></h2>
 <div class="kp" id="kp"></div><div class="pipe" id="pipe"></div><ul class="inv" id="inv"></ul>
 <div class="tabs" id="tabs"></div><div id="pane"></div>
 <details class="demo"><summary>Demo controls</summary><div class="g">
  <select id="script"><option value="">Provider: normal</option><option value="timeout_booked">Timeout after success</option><option value="timeout_not_booked,success">Timeout, then ok</option><option value="slot_taken,success">Slot taken, then ok</option></select>
  <label><input type="checkbox" id="drift"> price drift</label><label><input type="checkbox" id="evasive"> sneaky injection</label><label><input type="checkbox" id="c503"> cancel 503</label>
  <button id="new" class="pri">New session</button></div><div class="g">
  <button id="skip">Skip 11 min</button><select id="crash"><option value="">No crash</option><option value="after_book_call">Crash after book()</option><option value="before_book_call">Crash before book()</option></select><button id="restart">Restart agent</button></div></details>
</aside></div>
<script>
const SAFETY=new Set(["approval_granted","approval_consumed","approval_voided","approval_refused","proposal_shown","limit","untrusted_flagged","book_timeout","retry","error","recover","verification_mismatch","duplicate_confirmation_ignored","memory_forget","memory_confirm","memory_inference_refused"]);
const STEP={COLLECTING:0,PRESENTING:1,AWAITING_APPROVAL:2,EXECUTING:4,VERIFYING:5,DONE:6},STEPS=["Details","Search","Propose","Approve","Book","Verify"];
const TILES=[["🔧","Plumber","Find a plumber for my kitchen tap this week, mornings only, under ₹1,500 in Baner"],["💡","Electrician","Book the same electrician as last time, but not before 10 a.m. in Baner this week"],["❄️","AC servicing","Find AC servicing in Baner this week"]];
const SVC={ac_service:"AC servicing",plumber:"plumber",electrician:"electrician"};
let tab="trace",filter="all",catFilter="all",ti=0,events=[],S=null,busy=false,chat=[],sigF="",sigH="";
function openCatalog(svc){if(svc)catFilter=svc;tab="cat";$("app").classList.add("open");$("pill").setAttribute("aria-expanded",true);sigH="";drawHood()}
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const BASE=(location.origin&&location.origin!=="null"&&location.protocol!=="file:")?"":"http://127.0.0.1:8765";
const api=(p,b)=>fetch(BASE+p,b===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json()).catch(err=>{console.error("API error",p,err);return null});
const fmt=s=>{try{const iso=s.includes("T")?(s.endsWith("Z")?s:s+":00Z"):s;return new Date(iso).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"UTC"})}catch(e){return s}};
const day=s=>fmt(s).split(",")[0],hm=s=>s.slice(11,16),inr=n=>"₹"+Number(n).toLocaleString("en-IN");
const clean=t=>t.split("\n").filter(l=>!/^\s{2}(\d+\.|BOOK|CANCEL|RESCHEDULE)/.test(l)&&!/^(Please confirm this exact|Reply 'yes'|Reply with a number|The slot is held|Available new slots)/.test(l)&&!/^\s+- p_/.test(l)&&!/^Review notes/.test(l)).join("\n").trim();
async function send(text,label){if(busy||!text.trim())return;busy=true;chat.push({r:"u",t:label||text});$("in").value="";drawFeed(true);
  const r=await api("/api/chat",{text})||{};busy=false;
  if(r.crashed&&!r.reply)chat.push({r:"s",t:"The agent process crashed mid-booking. Open Demo controls and press Restart: it must check with the provider before doing anything."});
  else{const c=clean(r.reply||"");if(c)chat.push({r:"a",t:c,bad:/couldn't|no longer|Heads-up|limit|wrong|can't tell/.test(r.reply||"")})}
  await refresh(true)}
async function refresh(force){const stateData=await api("/api/state");if(stateData&&!stateData.error)S=stateData;const t=await api("/api/trace?after="+ti);if(Array.isArray(t)&&t.length){ti=t[t.length-1].i+1;events.push(...t)}drawFeed(force);drawHood()}
function drawFeed(force){
  const sig=JSON.stringify([chat.length,busy,S&&S.state,S&&S.options.length,S&&S.pending&&S.pending.slot+S.pending.price,S&&S.result&&S.result.booking_id,S&&S.bookings.map(b=>b.id+b.status+b.slot)]);
  if(S&&sig===sigF&&!force){tick();return}sigF=sig;const c=$("col");c.replaceChildren();
  if(!chat.length){const h=el("div","hero");h.innerHTML="<h1>What needs doing <em>at home?</em></h1><p>Tell me in your own words. I'll find a provider, hold the slot, and ask you before anything is booked, changed or cancelled.</p>";c.append(h);
    const t=el("div","tiles");TILES.forEach(([i,n,q])=>{const b=el("button","tile");b.append(el("span","",i),el("b","",n),el("small","","Search this week"));b.onclick=()=>send(q);t.append(b)});c.append(t);
    const bnr=el("div","dir-banner");const bL=el("div");bL.append(el("b","","Browse Verified Provider Directory (10 Providers)"),el("small","","Plumbers, electricians & AC experts with live slots in Baner & Koregaon Park"));const bB=el("button","","View Catalog Data →");bB.onclick=e=>{e.stopPropagation();openCatalog()};bnr.onclick=()=>openCatalog();bnr.append(bL,bB);c.append(bnr);
    const bk=(S?S.bookings:[]).filter(b=>b.status==="booked");if(bk.length){c.append(el("div","sec","Your upcoming bookings"));bk.forEach(b=>{const r=el("div","bk"),d=el("div");d.append(el("b","",`${b.provider_name} · ${SVC[b.service]}`),el("small","",`${fmt(b.slot)} · ${inr(b.price)} · ${b.id}`));
      const m=el("button","","Move to Saturday"),x=el("button","","Cancel");m.onclick=()=>send(`Move my ${SVC[b.service]} to Saturday`);x.onclick=()=>send(`Cancel my ${SVC[b.service]}`);r.append(d,m,x);c.append(r)})}}
  chat.forEach(m=>c.append(el("div","m "+m.r+(m.bad?" bad":""),m.t)));
  if(busy){const t=el("div","m a typing");t.append(el("i"),el("i"),el("i"));c.append(t)}
  if(S&&!busy){
    if(S.state==="PRESENTING"&&S.options.length){const o=el("div","opts");S.options.forEach((p,i)=>{const b=el("button","pc");b.append(el("div","av",p.name[0]),el("b","",p.name),el("div","pr",inr(p.price)),el("small","",`★ ${p.rating} · technician ${p.technician}`));
      const s=el("small");s.style.gridColumn="2/4";s.append(el("span","chip",day(p.slot)),el("span","chip",hm(p.slot)));b.append(s);b.onclick=()=>send(String(i+1),`${p.name} · ${day(p.slot)} ${hm(p.slot)}`);o.append(b)});c.append(o)}
